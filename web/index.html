<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CampusLink – one place for every Cavendish University student to find help, stay informed and connect.">
  <meta name="theme-color" content="#3B2DB3">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CampusLink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CampusLink</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the biggest download straight away, while the page is still opening. -->
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body { margin: 0; height: 100%; background: #3B2DB3; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(135deg, #3B2DB3, #7C3AED 55%, #FF6B6B);
      color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: opacity .4s ease;
    }
    #splash .logo {
      width: 76px; height: 76px; border-radius: 22px;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4);
      display: grid; place-items: center; font-size: 38px;
    }
    #splash h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.5px; }
    #splash p { margin: 0; opacity: .9; font-size: 14px; }
    #splash .bar { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; height: 100%; width: 40%; background: #fff; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
    #splash .hint { max-width: 290px; text-align: center; font-size: 13px; opacity: .85; line-height: 1.4; min-height: 36px; }
    #splash .legal { position: absolute; bottom: 18px; font-size: 12px; opacity: .85; }
    #splash .legal a { color: #fff; margin: 0 8px; }
    #splash button {
      display: none; border: 0; border-radius: 12px; padding: 11px 22px; font: 600 15px system-ui, sans-serif;
      background: #fff; color: #3B2DB3; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><svg viewBox="0 0 24 24" width="40" height="40" fill="#fff" aria-hidden="true"><path d="M8.4 18.2c.38.5.6 1.12.6 1.8 0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3c.44 0 .85.09 1.23.26l1.41-1.77c-.92-1.03-1.29-2.39-1.09-3.69l-2.03-.68C4.98 11.95 4.06 12.5 3 12.5c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3v.2l2.03.69c.64-1.21 1.82-2.09 3.22-2.32V5.91C9.96 5.57 9 4.4 9 3c0-1.66 1.34-3 3-3s3 1.34 3 3c0 1.4-.96 2.57-2.25 2.91v2.16c1.4.23 2.58 1.11 3.22 2.32L18 9.7v-.2c0-1.66 1.34-3 3-3s3 1.34 3 3-1.34 3-3 3c-1.06 0-1.98-.55-2.52-1.37l-2.03.68c.2 1.29-.16 2.65-1.09 3.69l1.41 1.77c.38-.17.79-.26 1.23-.26 1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3c0-.68.22-1.3.6-1.8l-1.41-1.77c-1.35.75-3.01.76-4.37 0L8.4 18.2z"/></svg></div>
    <h1>CampusLink</h1>
    <p id="splash-msg">Loading your campus…</p>
    <div class="bar"></div>
    <div class="hint" id="splash-hint"></div>
    <button id="splash-retry" type="button" onclick="location.reload()">Try again</button>
    <nav class="legal"><a href="about/">About</a><a href="privacy/">Privacy policy</a><a href="terms/">Terms of use</a></nav>
  </div>
  <script>
    // Keep people informed instead of an endless spinner. The first visit
    // (and the first visit after an update) downloads about 5 MB; later
    // visits reuse what the phone already has.
    (function () {
      var started = Date.now(), done = false;
      function say(msg, hint, retry) {
        if (done) return;
        var m = document.getElementById('splash-msg'), h = document.getElementById('splash-hint'),
            b = document.getElementById('splash-retry');
        if (m && msg) m.textContent = msg;
        if (h) h.textContent = hint || '';
        if (b) b.style.display = retry ? 'inline-block' : 'none';
      }
      window.addEventListener('flutter-first-frame', function () { done = true; });
      setTimeout(function () {
        say('Still loading…', navigator.onLine === false
          ? 'You seem to be offline. Connect to the internet and tap Try again.'
          : 'A slow connection can take up to a minute the first time. Later visits are much faster.');
      }, 12000);
      setTimeout(function () {
        say('This is taking too long', 'Your connection may have dropped. Tap Try again.', true);
      }, 75000);
      // A file failed to download (e.g. the network dropped): offer a retry at once.
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && Date.now() - started < 300000) {
          say('Loading stopped', 'Part of the app did not download. Check your connection and tap Try again.', true);
        }
      }, true);
      window.addEventListener('offline', function () {
        say(null, 'You went offline. Reconnect, then tap Try again.', true);
      });
    })();
  </script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script>
    // Install support: the browser offers "install" once; we keep the offer
    // so the app's own Install button can use it at the right moment.
    window.__clInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__clInstall = e; });
    window.addEventListener('appinstalled', function () { window.__clInstall = null; });
    window.campuslinkCanInstall = function () { return !!window.__clInstall; };
    window.campuslinkIsStandalone = function () {
      return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    };
    window.campuslinkUA = function () { return navigator.userAgent || ''; };
    window.campuslinkInstall = function () {
      var p = window.__clInstall;
      if (!p) return Promise.resolve('unavailable');
      p.prompt();
      return p.userChoice.then(function (r) { window.__clInstall = null; return r.outcome; });
    };

    // Notifications. The device's own notification sound is used.
    window.__clNotifyReg = null;
    function clNotifyReg() {
      if (!('serviceWorker' in navigator)) return Promise.resolve(null);
      if (window.__clNotifyReg) return Promise.resolve(window.__clNotifyReg);
      return navigator.serviceWorker.register('notify-sw.js', { scope: './notify/' })
        .then(function (r) { window.__clNotifyReg = r; return r; })
        .catch(function () { return null; });
    }
    window.campuslinkNotifyStatus = function () {
      return ('Notification' in window) ? Notification.permission : 'unsupported';
    };
    window.campuslinkNotifyAsk = function () {
      if (!('Notification' in window)) return Promise.resolve('unsupported');
      return Promise.resolve(Notification.requestPermission()).then(function (p) { clNotifyReg(); return p; });
    };
    window.campuslinkNotify = function (title, body, url) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return Promise.resolve(false);
      var opts = { body: body || '', icon: 'icons/Icon-192.png', badge: 'icons/Icon-192.png', data: { url: url || '/' }, silent: false };
      return clNotifyReg().then(function (r) {
        if (r) return r.showNotification(title, opts).then(function () { return true; });
        new Notification(title, opts); return true;
      }).catch(function () { try { new Notification(title, opts); return true; } catch (_) { return false; } });
    };
    if (window.campuslinkNotifyStatus() === 'granted') clNotifyReg();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
