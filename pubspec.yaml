name: campuslink
description: "CampusLink – one place for every Cavendish student to find help, stay informed and connect."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend (optional – app falls back to demo mode without keys)
  supabase_flutter: ^2.8.0

  # Local persistence (demo mode + offline cache)
  shared_preferences: ^2.3.3

  # Timetable import
  file_picker: ^8.1.4
  archive: ^3.6.1
  xml: ^6.5.0
  csv: ^6.0.0

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image: ^4.3.0
  flutter_local_notifications: ^19.5.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  # Inter (SIL Open Font License, see assets/fonts/LICENSE-Inter.txt), trimmed
  # to Latin so the app never waits for a font download.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 900
  uses-material-design: true
  assets:
    - assets/

# App icon for Android, iOS, Windows and macOS. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
