name: Build Android app (APK)

# Builds the Android app on every push to main and puts it at a fixed link:
# https://github.com/<owner>/<repo>/releases/download/android-latest/campuslink.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to update the release

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Safety gate: nothing is published unless the code checks and all tests pass.
      - name: Check code
        run: flutter analyze --no-fatal-infos
      - name: Run all tests
        run: flutter test

      - name: Put the permanent signing key in place
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret yet. This APK uses a temporary key, so phones must uninstall before installing it. Add the secret to make updates install over the old app."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/campuslink.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/campuslink.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Each build gets a higher number so phones know it is newer.
          BUILD=$((100 + ${{ github.run_number }}))
          if ! flutter build apk --release \
            --build-name=1.0.$BUILD --build-number=$BUILD \
            --dart-define=APP_BUILD=$BUILD \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || secrets.SUPERBASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee build.log; then
            # Show the real error at the top of the run page.
            { grep -A12 "What went wrong" build.log; grep -iE "error|failed|exception" build.log | tail -8; } | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk campuslink.apk
          ls -lh campuslink.apk
          # The app reads this to offer the update: the SHA-256 lets the phone
          # check it downloaded the genuine file; notes fill "What's new".
          BUILD=$BUILD URL="https://github.com/${{ github.repository }}/releases/download/android-latest/campuslink.apk" \
          python3 - <<'PY'
          import hashlib, json, os
          apk = open('campuslink.apk', 'rb').read()
          try:
              notes = [l.strip() for l in open('android-release-notes.txt', encoding='utf-8') if l.strip()][:5]
          except FileNotFoundError:
              notes = []
          b = int(os.environ['BUILD'])
          json.dump({'build': b, 'version': f'1.0.{b}', 'url': os.environ['URL'],
                     'sha256': hashlib.sha256(apk).hexdigest(), 'size': len(apk),
                     'notes': notes or ['Improvements and fixes.']}, open('version.json', 'w'))
          PY
          cat version.json

      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: CampusLink for Android (latest)
          body: |
            Latest Android build of CampusLink, made automatically from the main branch.
            Download campuslink.apk, open it, and allow "Install unknown apps" for your browser when asked.
          files: |
            campuslink.apk
            version.json
          make_latest: true
