name: Deploy web app to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web (PWA) for the site root
        # The Cloudflare address serves the app at "/", so base href is "/".
        run: |
          flutter build web --release \
            --base-href "/" \
            --no-web-resources-cdn \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Check the build is real (not the raw template)
        run: |
          test -f build/web/main.dart.js
          ! grep -q 'FLUTTER_BASE_HREF' build/web/index.html

      - name: Put the build where wrangler.jsonc looks
        run: rm -rf dist && cp -r build/web dist

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
