name: Deploy web app to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web (PWA) for the site root
        # The Cloudflare address serves the app at "/", so base href is "/".
        run: |
          flutter build web --release \
            --base-href "/" \
            --no-web-resources-cdn \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || secrets.SUPERBASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Check the build is real (not the raw template)
        run: |
          test -f build/web/main.dart.js
          ! grep -q 'FLUTTER_BASE_HREF' build/web/index.html

      - name: Put the build where wrangler.jsonc looks
        run: rm -rf dist && cp -r build/web dist

      - name: Check the Cloudflare secrets exist
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          [ -n "$T" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty (Settings > Secrets and variables > Actions)"; ok=0; }
          [ -n "$A" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty (Settings > Secrets and variables > Actions)"; ok=0; }
          [ "${#A}" -eq 32 ] || [ -z "$A" ] || echo "::warning::CLOUDFLARE_ACCOUNT_ID is ${#A} characters; a real one is 32. Check for spaces or a wrong copy."
          [ $ok -eq 1 ]

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            # Show the real reason on the public run page (no sign-in needed).
            grep -v '^\s*$' deploy.log | tail -12 | while IFS= read -r l; do echo "::error::$l"; done
            echo "--- which accounts this token can see ---"
            npx --yes wrangler@4 whoami 2>&1 | grep -v '^\s*$' | tail -10 | while IFS= read -r l; do echo "::notice::$l"; done || true
            exit 1
          fi
